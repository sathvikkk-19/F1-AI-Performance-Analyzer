<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 2026 Performance Simulator | Authentication & Access</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --red: #e10600;
    --red-hover: #b00000;
    --gold: #ffd700;
    --blue: #3b82f6;
    --cyan: #06b6d4;
    --dark: #020617;
    --card: rgba(8, 12, 26, 0.92);
    --border: rgba(255, 255, 255, 0.14);
    --text-muted: rgba(255, 255, 255, 0.55);
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(ellipse at 50% 15%, rgba(225, 6, 0, 0.15), transparent 55%),
        radial-gradient(ellipse at 85% 85%, rgba(6, 182, 212, 0.08), transparent 45%),
        #020617;
    color: #ffffff;
    font-family: 'Rajdhani', sans-serif;
    position: relative;
    padding: 32px 16px;
}

.racing-line {
    position: fixed;
    left: 0;
    top: 0;
    width: 4px;
    height: 100%;
    background: linear-gradient(
        to bottom,
        transparent,
        var(--red),
        var(--gold),
        transparent
    );
    opacity: 0.85;
    z-index: 1;
}

.login-wrap {
    position: relative;
    z-index: 3;
    width: min(480px, 100%);
    margin: auto 0;
}

.login-card {
    padding: 38px 34px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    backdrop-filter: blur(24px);
    box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.7),
        0 0 35px rgba(225, 6, 0, 0.08);
}

.logo {
    text-align: center;
    margin-bottom: 18px;
}

.logo img {
    width: 90px;
    filter: drop-shadow(0 0 12px rgba(225, 6, 0, 0.5));
}

.eyebrow {
    color: var(--red);
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-align: center;
    margin-bottom: 6px;
    text-transform: uppercase;
    font-weight: 700;
}

h1 {
    font-family: 'Orbitron', monospace;
    font-size: 23px;
    text-align: center;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
}

.subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 24px;
}

/* ── TAB SELECTOR ── */
.auth-tabs {
    display: flex;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 6px;
    padding: 4px;
    margin-bottom: 24px;
}

.auth-tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 10px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.25s ease;
}

.auth-tab-btn.active {
    background: linear-gradient(135deg, rgba(225, 6, 0, 0.85), rgba(169, 0, 0, 0.95));
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(225, 6, 0, 0.35);
}

.field {
    margin-bottom: 16px;
}

label {
    display: block;
    margin-bottom: 6px;
    color: rgba(255, 255, 255, 0.7);
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

input, select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(0, 0, 0, 0.6);
    color: white;
    outline: none;
    font: 600 15px 'Rajdhani', sans-serif;
    transition: border-color 0.2s, box-shadow 0.2s;
}

select {
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e10600' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 16px;
}

select option {
    background: #080d1e;
    color: #ffffff;
}

input:focus, select:focus {
    border-color: rgba(225, 6, 0, 0.8);
    box-shadow: 0 0 0 3px rgba(225, 6, 0, 0.2);
}

.btn-submit {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg, var(--red), #a90000);
    box-shadow: 0 4px 20px rgba(225, 6, 0, 0.35);
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
}

.btn-submit:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 26px rgba(225, 6, 0, 0.55);
}

.btn-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.alert-box {
    display: none;
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
}

.alert-error {
    border: 1px solid rgba(248, 113, 113, 0.35);
    background: rgba(248, 113, 113, 0.1);
    color: #fca5a5;
}

.alert-success {
    border: 1px solid rgba(52, 211, 153, 0.35);
    background: rgba(52, 211, 153, 0.1);
    color: #6ee7b7;
}

.admin-callout {
    margin-top: 22px;
    padding: 12px 14px;
    border-radius: 4px;
    border: 1px dashed rgba(255, 215, 0, 0.3);
    background: rgba(255, 215, 0, 0.04);
    text-align: center;
    color: rgba(255, 255, 255, 0.6);
    font-size: 12px;
    line-height: 1.5;
}

.admin-callout strong {
    color: var(--gold);
    font-family: 'Orbitron', monospace;
    font-size: 11px;
}

.home-link {
    display: block;
    margin-top: 18px;
    text-align: center;
    color: rgba(255, 255, 255, 0.5);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: color 0.2s;
}

.home-link:hover {
    color: white;
}

.footer {
    width: 100%;
    max-width: 480px;
    margin-top: 24px;
    display: flex;
    justify-content: center;
    gap: 18px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.4);
}

.footer a {
    color: rgba(255, 255, 255, 0.45);
    text-decoration: none;
    transition: color 0.2s;
}

.footer a:hover {
    color: #ffffff;
}

.spinner {
    display: none;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="racing-line"></div>

<div class="login-wrap">
    <div class="login-card">

        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/33/F1.svg" alt="F1">
        </div>

        <div class="eyebrow">
            Formula 1 Telemetry Operations
        </div>

        <h1 id="authTitle">Telemetry Access</h1>

        <div class="subtitle" id="authSubtitle">
            Access the 2026 Technical Regulations Strategy Simulator
        </div>

        <!-- Mode Switcher -->
        <div class="auth-tabs">
            <button type="button" class="auth-tab-btn active" id="tabSignIn" onclick="switchAuthMode('login')">
                Sign In
            </button>
            <button type="button" class="auth-tab-btn" id="tabRegister" onclick="switchAuthMode('register')">
                Create Account
            </button>
        </div>

        <!-- SIGN IN FORM -->
        <form id="loginForm">
            <div class="field">
                <label for="loginIdentifier">Username or Email</label>
                <input
                    id="loginIdentifier"
                    type="text"
                    autocomplete="username"
                    placeholder="Enter your username or email"
                    required
                >
            </div>

            <div class="field">
                <label for="loginPassword">Password</label>
                <input
                    id="loginPassword"
                    type="password"
                    autocomplete="current-password"
                    placeholder="••••••••"
                    required
                >
            </div>

            <button type="submit" class="btn-submit" id="btnLoginSubmit">
                <span class="spinner" id="loginSpinner"></span>
                <span id="loginBtnText">SIGN IN</span>
            </button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" style="display: none;">
            <div class="field">
                <label for="regUsername">Username</label>
                <input
                    id="regUsername"
                    type="text"
                    autocomplete="username"
                    placeholder="Choose a callsign (e.g. MaxV)"
                    required
                    minlength="3"
                >
            </div>

            <div class="field">
                <label for="regEmail">Email Address</label>
                <input
                    id="regEmail"
                    type="email"
                    autocomplete="email"
                    placeholder="driver@f1-team.com"
                    required
                >
            </div>

            <div class="field">
                <label for="regPassword">Password (Min 6 Characters)</label>
                <input
                    id="regPassword"
                    type="password"
                    autocomplete="new-password"
                    placeholder="••••••••"
                    required
                    minlength="6"
                >
            </div>

            <div class="field">
                <label for="regTeam">Select Starting Constructor</label>
                <select id="regTeam" required>
                    <option value="Oracle Red Bull Racing">Oracle Red Bull Racing</option>
                    <option value="McLaren Mastercard">McLaren Mastercard</option>
                    <option value="Scuderia Ferrari HP" selected>Scuderia Ferrari HP</option>
                    <option value="Mercedes-AMG Petronas">Mercedes-AMG Petronas</option>
                    <option value="Aston Martin Aramco">Aston Martin Aramco</option>
                    <option value="Visa Cash App RB">Visa Cash App RB</option>
                    <option value="Audi Revolut F1 Team">Audi Revolut F1 Team</option>
                    <option value="Atlassian Williams">Atlassian Williams</option>
                    <option value="BWT Alpine">BWT Alpine</option>
                    <option value="TGR Haas">TGR Haas</option>
                    <option value="Cadillac Formula 1">Cadillac Formula 1</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="btnRegSubmit">
                <span class="spinner" id="regSpinner"></span>
                <span id="regBtnText">JOIN GRID &amp; START</span>
            </button>
        </form>

        <!-- Alerts -->
        <div id="errorAlert" class="alert-box alert-error"></div>
        <div id="successAlert" class="alert-box alert-success"></div>

        <!-- Official Admin Callout -->
        <div class="admin-callout">
            Official F1 Admin Access:<br>
            Username: <strong>admin</strong> &bull; Password: <strong>f1admin2026</strong>
        </div>

        <a class="home-link" href="index.html">
            &larr; Return to Overview
        </a>

    </div>
</div>

<footer class="footer">
    <a href="privacy.html">Privacy Policy</a>
    <span>&middot;</span>
    <a href="terms.html">Terms and Conditions</a>
</footer>

<script>
const API_BASE = (typeof window !== "undefined" && window.location.origin && !window.location.origin.startsWith("file:"))
    ? (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" ? "http://127.0.0.1:5000" : window.location.origin)
    : "http://127.0.0.1:5000";

let currentMode = "login";

function switchAuthMode(mode) {
    currentMode = mode;
    hideAlerts();

    const tabSignIn = document.getElementById("tabSignIn");
    const tabRegister = document.getElementById("tabRegister");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");

    if (mode === "login") {
        tabSignIn.classList.add("active");
        tabRegister.classList.remove("active");
        loginForm.style.display = "block";
        registerForm.style.display = "none";
        authTitle.textContent = "Telemetry Access";
        authSubtitle.textContent = "Access the 2026 Technical Regulations Strategy Simulator";
    } else {
        tabSignIn.classList.remove("active");
        tabRegister.classList.add("active");
        loginForm.style.display = "none";
        registerForm.style.display = "block";
        authTitle.textContent = "Driver Registration";
        authSubtitle.textContent = "Create your telemetry account and select your constructor";
    }
}

function showAlert(message, isError = true) {
    const errorEl = document.getElementById("errorAlert");
    const successEl = document.getElementById("successAlert");
    if (isError) {
        errorEl.textContent = message;
        errorEl.style.display = "block";
        successEl.style.display = "none";
    } else {
        successEl.textContent = message;
        successEl.style.display = "block";
        errorEl.style.display = "none";
    }
}

function hideAlerts() {
    document.getElementById("errorAlert").style.display = "none";
    document.getElementById("successAlert").style.display = "none";
}

function handleAuthSuccess(user, customMessage = null) {
    sessionStorage.setItem("f1_auth_session", "authenticated");
    sessionStorage.setItem("f1_username", user.username || "");
    sessionStorage.setItem("f1_role", user.role || "user");
    sessionStorage.setItem("f1_is_admin", user.is_admin ? "true" : "false");
    sessionStorage.setItem("f1_user_id", user.id || "");
    if (user.selected_team) {
        sessionStorage.setItem("f1_selected_team", user.selected_team);
        localStorage.setItem("f1_selected_team", user.selected_team);
    }

    showAlert(customMessage || `Welcome, ${user.username}! Accessing telemetry grid...`, false);

    const params = new URLSearchParams(window.location.search);
    const requestedNext = params.get("next");
    let target = "dashboard.html?view=my";

    if (user.is_admin) {
        target = "dashboard.html?view=admin";
    } else if (requestedNext && (requestedNext.startsWith("dashboard.html") || requestedNext === "index.html")) {
        target = requestedNext;
    }

    setTimeout(() => {
        window.location.replace(target);
    }, 700);
}

// Sign In submission
document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    hideAlerts();

    const identifier = document.getElementById("loginIdentifier").value.trim();
    const password = document.getElementById("loginPassword").value;
    const btn = document.getElementById("btnLoginSubmit");
    const spinner = document.getElementById("loginSpinner");
    const btnText = document.getElementById("loginBtnText");

    btn.disabled = true;
    spinner.style.display = "inline-block";
    btnText.textContent = "VERIFYING...";

    try {
        const response = await fetch(`${API_BASE}/api/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ identifier, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
            handleAuthSuccess(data.user);
        } else {
            showAlert(data.message || "Invalid username/email or password.");
            btn.disabled = false;
            spinner.style.display = "none";
            btnText.textContent = "SIGN IN";
        }
    } catch (err) {
        // Fallback for local admin bypass if server unreachable
        if (identifier === "admin" && password === "f1admin2026") {
            handleAuthSuccess({ username: "admin", role: "admin", is_admin: true, selected_team: "Oracle Red Bull Racing" }, "Offline Admin verification succeeded.");
            return;
        }
        showAlert("Connection error connecting to telemetry server. Please verify backend is running.");
        btn.disabled = false;
        spinner.style.display = "none";
        btnText.textContent = "SIGN IN";
    }
});

// Register submission
document.getElementById("registerForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    hideAlerts();

    const username = document.getElementById("regUsername").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const password = document.getElementById("regPassword").value;
    const selected_team = document.getElementById("regTeam").value;

    const btn = document.getElementById("btnRegSubmit");
    const spinner = document.getElementById("regSpinner");
    const btnText = document.getElementById("regBtnText");

    btn.disabled = true;
    spinner.style.display = "inline-block";
    btnText.textContent = "CREATING ACCOUNT...";

    try {
        const response = await fetch(`${API_BASE}/api/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ username, email, password, selected_team })
        });

        const data = await response.json();

        if (response.ok && data.success) {
            handleAuthSuccess(data.user, `Account created for ${data.user.username}! Initializing ${data.user.selected_team || selected_team}...`);
        } else {
            showAlert(data.message || "Failed to create account.");
            btn.disabled = false;
            spinner.style.display = "none";
            btnText.textContent = "JOIN GRID & START";
        }
    } catch (err) {
        showAlert("Server connection failed. Please ensure the backend server is running.");
        btn.disabled = false;
        spinner.style.display = "none";
        btnText.textContent = "JOIN GRID & START";
    }
});
</script>

</body>
</html>
